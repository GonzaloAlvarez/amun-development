---
- name: Create apt keyrings directory (Debian)
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Add GitHub CLI keyring (Debian)
  ansible.builtin.get_url:
    url: "https://cli.github.com/packages/githubcli-archive-keyring.gpg"
    dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
    mode: "0644"
  become: true
  when: ansible_facts['os_family'] == 'Debian'

# Some hosts carry hand-added cli.github.com entries (wrong suite — the repo
# only publishes "stable" — or a different Signed-By); any broken entry makes
# `apt-get update` fail wholesale. Drop every cli.github.com source that is
# not the file we manage, and ours too if it carries a non-stable suite.
- name: Find pre-existing GitHub CLI apt sources (Debian)
  ansible.builtin.shell: |
    for f in /etc/apt/sources.list.d/*; do
      grep -qs 'cli\.github\.com' "$f" || continue
      if [ "$f" != "/etc/apt/sources.list.d/github-cli.list" ] || grep 'cli\.github\.com/packages' "$f" | grep -qv 'packages stable'; then
        echo "$f"
      fi
    done
  register: devtools_stale_gh_sources
  changed_when: false
  when: ansible_facts['os_family'] == 'Debian'

- name: Remove conflicting GitHub CLI apt sources (Debian)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  become: true
  loop: "{{ devtools_stale_gh_sources.stdout_lines | default([]) }}"
  when: ansible_facts['os_family'] == 'Debian'

- name: Add GitHub CLI apt repository (Debian)
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_facts['architecture'] | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }} signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main"
    filename: github-cli
    state: present
  become: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Install devtools packages (Debian)
  ansible.builtin.apt:
    name: "{{ devtools_debian_packages }}"
    state: present
    update_cache: true
  become: true
  retries: 5
  delay: 5
  register: apt_devtools
  until: apt_devtools is success
  when: ansible_facts['os_family'] == 'Debian'

- name: Ensure ~/.local/bin exists (Debian)
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
    state: directory
    mode: "0755"
  when: ansible_facts['os_family'] == 'Debian'

# Debian renames the upstream binaries; restore the canonical names.
- name: Link fd and bat to their Debian binaries
  ansible.builtin.file:
    src: "/usr/bin/{{ item.src }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/{{ item.dest }}"
    state: link
  loop:
    - { src: fdfind, dest: fd }
    - { src: batcat, dest: bat }
  when: ansible_facts['os_family'] == 'Debian'

- name: Install lazygit from GitHub releases (Debian)
  ansible.builtin.import_tasks: lazygit.yml
  when: ansible_facts['os_family'] == 'Debian'

- name: Install git-delta from GitHub releases (Debian)
  ansible.builtin.import_tasks: delta.yml
  when: ansible_facts['os_family'] == 'Debian'

- name: Install devtools packages (Arch)
  community.general.pacman:
    name: "{{ devtools_arch_packages }}"
    state: present
    update_cache: true
  become: true
  when: ansible_facts['os_family'] == 'Archlinux'

- name: Install devtools packages (macOS)
  community.general.homebrew:
    name: "{{ devtools_darwin_packages }}"
    state: present
  when: ansible_facts['os_family'] == 'Darwin'

- name: Verify gh installation
  ansible.builtin.command: gh --version
  changed_when: false

- name: Verify direnv installation
  ansible.builtin.command: direnv version
  changed_when: false
