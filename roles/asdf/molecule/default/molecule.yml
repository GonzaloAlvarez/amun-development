---
# L1 molecule covers Debian (the closest reference for the Pi fleet and
# cloud devboxes). Arch L1 coverage is intentionally NOT here because amd64
# emulation on Apple Silicon Docker Desktop is broken without Rosetta and
# there is no multi-arch `archlinux-ansible-systemd` image at the moment.
#
# Arch coverage comes from L2 (`~/dev/amun/test arch -p development`) which
# boots a real Arch ARM VM in QEMU and runs the full amun + plugin chain.
#
# The scenario lives under roles/asdf/ but converges ALL FOUR roles (asdf,
# claude, codex, devtools) — the composition main.yml actually ships.
driver:
  name: docker
platforms:
  - name: development-debian
    image: geerlingguy/docker-debian12-ansible:latest
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    command: /usr/lib/systemd/systemd
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/..
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
