---
- name: Prepare
  hosts: all
  tasks:
    - name: Refresh apt cache
      ansible.builtin.apt:
        update_cache: true
      become: true
      retries: 5
      delay: 5
      register: apt_refresh
      until: apt_refresh is success

    - name: Ensure TLS trust anchors are present
      ansible.builtin.apt:
        name: ca-certificates
        state: present
      become: true
